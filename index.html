<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lesson Booking</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

    <div id="app">
        <header style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: 10px; margin-bottom: 20px;">
            <h1>{{ siteTitle }}</h1>
            <button v-on:click="toggleCart" :disabled="!showCart && cart.length === 0">
                {{ showCart ? 'View Lessons' : 'Cart (' + cart.length + ')' }}
            </button>
        </header>

        <main>
            <div v-if="!showCart">
                <h2>Lessons</h2>
                <div v-for="lesson in lessons" :key="lesson.id" style="border: 1px solid #ccc; padding: 10px; margin-bottom: 10px;">
                    <p>ID: {{ lesson.id }}</p>
                    <p>Subject: {{ lesson.subject }}</p>
                    <p>Location: {{ lesson.location }}</p>
                    <p>Price: £{{ lesson.price }}</p>
                    <p>Spaces: {{ lesson.spaces }}</p>
                    <button v-on:click="addToCart(lesson)" :disabled="!canAddToCart(lesson)">Add to Cart</button>
                    <span v-if="!canAddToCart(lesson)" style="color: red; margin-left: 10px;">Sold out</span>
                </div>
            </div>

            <div v-else>
                <h2>Shopping Cart</h2>

                <div v-if="submitted" style="color: green; margin-bottom: 15px;">
                    <p>Order submitted successfully!</p>
                </div>

                <div v-if="cart.length === 0 && !submitted">
                    <p>Cart is empty.</p>
                </div>

                <div v-if="cart.length > 0">
                    <ul>
                        <template v-for="lesson in lessons" :key="lesson.id">
                            <li v-if="cartCount(lesson.id) > 0" style="margin-bottom: 8px;">
                                {{ lesson.subject }} - {{ lesson.location }} | Quantity: {{ cartCount(lesson.id) }} | Price: £{{ lesson.price * cartCount(lesson.id) }}
                                <button v-on:click="removeFromCart(lesson)" style="margin-left: 10px;">Remove</button>
                            </li>
                        </template>
                    </ul>

                    <hr style="margin: 20px 0;">

                    <h3>Checkout</h3>
                    <p>
                        Name: <input v-model.trim="order.name" placeholder="Name">
                    </p>
                    <p>
                        Phone: <input v-model.trim="order.phone" placeholder="Phone">
                    </p>
                    <button v-on:click="checkout" :disabled="!isFormValid">Checkout</button>
                </div>

                <p style="margin-top: 20px;">
                    <button v-on:click="toggleCart">Back</button>
                </p>
            </div>
        </main>
    </div>

    <script type="module">
        const { createApp } = Vue
        createApp({
            data() {
                return {
                    siteTitle: 'Lesson Booking',
                    showCart: false,
                    lessons: [
                        { id: 1001, subject: 'Math', location: 'London', price: 100, spaces: 5 },
                        { id: 1002, subject: 'English', location: 'Oxford', price: 90, spaces: 5 },
                        { id: 1003, subject: 'Science', location: 'Cambridge', price: 120, spaces: 5 }
                    ],
                    cart: [],
                    order: {
                        name: '',
                        phone: ''
                    },
                    submitted: false
                }
            },
            methods: {
                canAddToCart(lesson) {
                    return lesson.spaces > 0;
                },
                addToCart(lesson) {
                    if (this.canAddToCart(lesson)) {
                        this.cart.push(lesson.id);
                        lesson.spaces--;
                        this.submitted = false;
                    }
                },
                toggleCart() {
                    this.showCart = !this.showCart;
                },
                cartCount(id) {
                    let count = 0;
                    for (let i = 0; i < this.cart.length; i++) {
                        if (this.cart[i] === id) {
                            count++;
                        }
                    }
                    return count;
                },
                removeFromCart(lesson) {
                    const index = this.cart.indexOf(lesson.id);
                    if (index > -1) {
                        this.cart.splice(index, 1);
                        lesson.spaces++;
                    }
                },
                checkout() {
                    if (this.isFormValid) {
                        this.submitted = true;
                        this.cart = [];
                    }
                }
            },
            computed: {
                isFormValid() {
                    const nameCheck = /^[A-Za-z\s]+$/.test(this.order.name);
                    const phoneCheck = /^[0-9]+$/.test(this.order.phone);
                    return nameCheck && phoneCheck;
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
